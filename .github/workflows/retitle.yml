# Put the English title on every vote that has one.
#
# The subject vocabulary the Parliament tags its documents with cannot be read
# back — it publishes the tags and no names for them — so the label on a card
# is the committee that wrote the text, which is on the document as creator.
#
# A window, because a backfill rewriting the other term at the same time would
# undo this work and this would undo the backfill's.

name: Put English titles on the votes

on:
  # Weekly, over the votes of the last four months: a vote imported under a
  # title in another language gets the English one as soon as the Parliament
  # publishes it. By hand, from any date.
  schedule:
    - cron: "47 3 * * 6"
  workflow_dispatch:
    inputs:
      from:
        description: "Earliest vote to retitle (YYYY-MM-DD)"
        default: "2020-01-01"
      until:
        description: "Latest vote to label (YYYY-MM-DD), blank for no limit"
        default: ""
      minutes:
        description: "Stop reading after this many minutes and commit what was read"
        default: "80"

concurrency:
  group: retitle
  cancel-in-progress: false

jobs:
  topics:
    outputs:
      changed: ${{ steps.label.outputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Read the English titles
        run: |
          set -euo pipefail
          from="${{ inputs.from }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ -z "$from" ]; then
            from="$(date -u -d '120 days ago' +%F)"
          fi
          until=""
          if [ -n "${{ inputs.until }}" ]; then until="--until ${{ inputs.until }}"; fi
          node scripts/retitle.mjs --from "$from" $until \
            --minutes "${{ inputs.minutes || '80' }}"

          node scripts/tag-topics.mjs
          node scripts/build-index.mjs
          node tests/import.test.mjs
          node scripts/validate-data.mjs

      - name: Commit the titles
        id: label
        env:
          REBUILD: node scripts/tag-topics.mjs && node scripts/build-index.mjs && node scripts/validate-data.mjs
        run: |
          scripts/push-changes.sh "Put the English title on votes published in another language

          Read from each document on the Parliament's open data portal, by
          .github/workflows/retitle.yml. Nothing is translated: a vote whose
          document carries no English keeps what the Parliament published." data/

  # A push made with the built-in token does not trigger other workflows, so the
  # labels would otherwise sit in the repository and never reach the site. This
  # is exactly how the chips were committed twice and shown never.
  publish:
    needs: topics
    if: needs.topics.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
