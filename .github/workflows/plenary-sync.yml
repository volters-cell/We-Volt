# Follow the plenary automatically.
#
# Everything comes from the Parliament's open data portal,
# data.europarl.europa.eu, whose record of a sitting names every member and how
# they voted. The cadence follows what it publishes and when:
#
#   - A sitting's decisions appear during the day, shortly after each voting
#     session. So on a day the Parliament sits, this runs every two hours from
#     morning to night, and a vote reaches the site within about two hours of
#     being taken.
#   - Which days those are is read from the Parliament's own calendar, not
#     guessed at. Every scheduled run asks scripts/sitting-day.mjs first and
#     stops in seconds if nobody is sitting. Monday to Thursday was the guess
#     before, and of the 39 sessions the Parliament has published one runs
#     Tuesday to Friday: a whole sitting day the guess could not see.
#   - The portal fills in details, among them whether a text carried, over the
#     following day. A nightly run re-imports the last fortnight whatever the
#     calendar says, so a result this project had to derive is replaced by the
#     Parliament's own.
#   - The plenary calendar and the member directory change slowly. Weekly —
#     and the calendar has to be refreshed for the gate above to stay true,
#     which is why a stale calendar makes the gate answer yes rather than no.
#
# Runs are cheap and idempotent: on a day with no sitting the portal records no
# votes, nothing is written, and nothing is committed.
#
# Before enabling: Settings > Actions > General > Workflow permissions must be
# "Read and write permissions" so the run can commit what it imports.

name: Plenary sync

on:
  schedule:
    - cron: "5 8-20/2 * * *"  # through a sitting day; stops at once on any other
    - cron: "30 21 * * *"     # nightly, always: the votes lists and any late annex
    - cron: "0 4 * * 1"       # Monday: refresh the calendar and the members
  workflow_dispatch:
    inputs:
      since:
        description: "Import sittings from this date (YYYY-MM-DD)"
        required: false
      all:
        description: "Include amendment votes, not only final votes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: plenary-sync
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Does the Parliament sit today? The nightly run and the weekly one do
      # not ask: the first exists to pick up details the portal adds after a
      # sitting ends, and the second to refresh the calendar this very question
      # is answered from. Everything else asks, and stops here if the answer is
      # no, which on most days of the year it is.
      - name: Is the Parliament sitting today?
        id: sitting
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ] || \
             [ "${{ github.event.schedule }}" = "30 21 * * *" ] || \
             [ "${{ github.event.schedule }}" = "0 4 * * 1" ]; then
            echo "Running whatever the calendar says."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          answer=$(node scripts/sitting-day.mjs)
          echo "go=$([ "$answer" = "yes" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The calendar is what the site reads to say when the last session was
      # and when the next one starts. Weekly is enough; a failure is not fatal.
      - name: Refresh the plenary calendar
        if: github.event.schedule == '0 4 * * 1' || github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-sessions.mjs || echo "calendar refresh failed; keeping the last one"

      # --refresh-meps re-reads the member directory: the ballots are lists of
      # person ids, so a newly seated MEP missing from the cache would appear in
      # a vote as a number with no name and no country.
      - name: Import roll-call votes
        if: steps.sitting.outputs.go == 'true'
        run: |
          node scripts/fetch-plenary.mjs --refresh-meps \
            ${{ inputs.since && format('--since {0}', inputs.since) || '' }} \
            ${{ inputs.all && '--all' || '' }}

      # What each new vote is about, read from its own title. Cheap, offline,
      # and it has to run before the index, which carries the topics to the
      # cards. Without it a newly imported vote arrives with no chip.
      - name: Say what the new votes are about
        if: steps.sitting.outputs.go == 'true'
        run: node scripts/tag-topics.mjs

      - name: Rebuild the index
        if: steps.sitting.outputs.go == 'true'
        run: node scripts/build-index.mjs

      # The same votes seen from the other end: one file per member, so a reader
      # following an MEP sees the new sitting too. Without this the vote pages
      # move and the member pages stay where they were.
      - name: Rebuild the member profiles
        if: steps.sitting.outputs.go == 'true'
        run: node scripts/build-members.mjs

      - name: Check every record before it goes near the site
        if: steps.sitting.outputs.go == 'true'
        run: |
          node tests/import.test.mjs
          node scripts/validate-data.mjs

      - name: Commit what changed
        id: commit
        if: steps.sitting.outputs.go == 'true'
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Nothing new."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "eu-tracker-bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Import from the European Parliament

          Automated by .github/workflows/plenary-sync.yml. Records land with
          an empty summary: writing one is editorial work."

          # The import takes a few minutes, and anything pushed to the branch
          # during them makes a bare push fail — the sitting is imported, and
          # then thrown away, and the votes wait for the next run. Which is
          # what happened the first time this ran: a one-line fix pushed to
          # another file mid-import cost the whole sitting.
          #
          # So: rebase first, and where a conflict is inside data/ take the
          # files this run just generated, because they were built from the
          # portal minutes ago and the other side is a regenerated index. A
          # conflict anywhere else is not something to guess at.
          if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
            if git diff --name-only --diff-filter=U | grep -qv '^data/'; then
              echo "::error::Conflict outside data/ — stopping rather than guessing."
              git rebase --abort || true
              exit 1
            fi
            git checkout --theirs -- data/ 2>/dev/null || true
            git add data/
            GIT_EDITOR=true git rebase --continue
          fi

          # And if the branch moved again between the rebase and the push,
          # try once more rather than lose the sitting to a second-long race.
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            sleep 5
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

  # A push made with the built-in token does not trigger other workflows, so the
  # import would otherwise sit in the repository without ever reaching the site.
  publish:
    needs: import
    if: needs.import.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
