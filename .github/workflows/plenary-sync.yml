# Follow the plenary automatically.
#
# Everything comes from the Parliament's open data portal,
# data.europarl.europa.eu, whose record of a sitting names every member and how
# they voted. The cadence follows what it publishes and when:
#
#   - A sitting's decisions appear during the day, shortly after each voting
#     session. Runs at midday and in the evening on Mon-Thu catch both.
#   - The portal fills in details, among them whether a text carried, over the
#     following day. A nightly run re-imports the last fortnight, so a result
#     this project had to derive is replaced by the Parliament's own.
#   - The plenary calendar and the member directory change slowly. Weekly.
#
# Runs are cheap and idempotent: on a day with no sitting the portal records no
# votes, nothing is written, and nothing is committed.
#
# Before enabling: Settings > Actions > General > Workflow permissions must be
# "Read and write permissions" so the run can commit what it imports.

name: Plenary sync

on:
  schedule:
    - cron: "40 12 * * 1-4"   # during the sitting, after the midday votes
    - cron: "40 18 * * 1-4"   # after the evening votes
    - cron: "30 21 * * *"     # nightly: pick up the votes lists and any late annex
    - cron: "0 4 * * 1"       # Monday: refresh the calendar and the members
  workflow_dispatch:
    inputs:
      since:
        description: "Import sittings from this date (YYYY-MM-DD)"
        required: false
      all:
        description: "Include amendment votes, not only final votes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: plenary-sync
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The calendar is what the site reads to say when the last session was
      # and when the next one starts. Weekly is enough; a failure is not fatal.
      - name: Refresh the plenary calendar
        if: github.event.schedule == '0 4 * * 1' || github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-sessions.mjs || echo "calendar refresh failed; keeping the last one"

      # --refresh-meps re-reads the member directory: the ballots are lists of
      # person ids, so a newly seated MEP missing from the cache would appear in
      # a vote as a number with no name and no country.
      - name: Import roll-call votes
        run: |
          node scripts/fetch-plenary.mjs --refresh-meps \
            ${{ inputs.since && format('--since {0}', inputs.since) || '' }} \
            ${{ inputs.all && '--all' || '' }}

      - name: Rebuild the index
        run: node scripts/build-index.mjs

      # The same votes seen from the other end: one file per member, so a reader
      # following an MEP sees the new sitting too. Without this the vote pages
      # move and the member pages stay where they were.
      - name: Rebuild the member profiles
        run: node scripts/build-members.mjs

      - name: Check every record before it goes near the site
        run: |
          node tests/import.test.mjs
          node scripts/validate-data.mjs

      - name: Commit what changed
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "eu-tracker-bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Import from the European Parliament

          Automated by .github/workflows/plenary-sync.yml. Records land with
          an empty summary: writing one is editorial work."
          git push
