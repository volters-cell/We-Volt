# Give every member a face and a party.
#
# The vote records name a member by id. The Parliament's own record of that
# person carries two more things a reader expects — the address of the official
# portrait, and the national party they were elected for — and this job reads
# them and commits the result.
#
# It runs on the first of the month, because parties rename themselves and
# members change them, and on demand from the Actions tab. A run asks only
# about members still missing one of the two, so the monthly run is a handful
# of requests; "everyone" re-reads the whole House.

name: Faces and parties

on:
  schedule:
    # The 2nd: one job a day at the start of the month, so they do not all
    # push in the same minute (see scripts/push-changes.sh).
    - cron: "20 4 2 * *"
  workflow_dispatch:
    inputs:
      everyone:
        description: "Re-read every member, not only those missing something"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: profiles-sync
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Read each member's record
        run: |
          if [ "${{ inputs.everyone }}" = "true" ]; then
            node scripts/fetch-profiles.mjs --all
          else
            node scripts/fetch-profiles.mjs
          fi

      - name: Rebuild the member files and check the data
        run: |
          node scripts/build-members.mjs
          node scripts/build-index.mjs
          node scripts/validate-data.mjs

      - name: Commit what changed
        id: commit
        env:
          REBUILD: node scripts/build-members.mjs && node scripts/build-index.mjs && node scripts/validate-data.mjs
        run: scripts/push-changes.sh "Read the members' portraits and parties from the Parliament" data

  # A push made with the workflow's own token starts no other workflow, so
  # what this job changed would wait for the next plenary to reach the site.
  publish:
    needs: read
    if: needs.read.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
