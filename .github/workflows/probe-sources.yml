# Ask the Parliament's open data portal what its records contain.
#
# The website answers 202 with an empty body to everything automated, so the
# portal at data.europarl.europa.eu is the only usable source. Its sitting
# decisions carry the individual ballots — had_voter_favor and its siblings,
# each a list of person ids. What this round settles is the other half: how the
# portal describes a member, so those ids can be turned into a name, a country
# and a political group.
#
# Run it from the Actions tab; it writes nothing and changes nothing.

name: Probe the sources

on:
  workflow_dispatch:
    inputs:
      mep:
        description: "A member id to test"
        required: false
        default: "197628"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read how the portal describes a member
        run: |
          MEP="${{ inputs.mep || '197628' }}"
          UA='eu-tracker/0.1 (open data import; contact via the repository)'
          BASE=https://data.europarl.europa.eu/api/v2
          get () { curl -sSL -m 60 -A "$UA" -H 'accept: application/ld+json' "$1"; }

          echo "=== the current membership, asked for in bulk"
          get "$BASE/meps/show-current?format=application%2Fld%2Bjson&limit=1000&offset=0" > /tmp/cur.json
          jq '.data | length' /tmp/cur.json
          jq -r 'keys[]' /tmp/cur.json
          jq -r '[.data[] | keys[]] | group_by(.) | map("\(.[0])  \(length)")[]' /tmp/cur.json
          echo "-- how many distinct countries and groups came back"
          jq -r '[.data[]["api:country-of-representation"]] | unique | length' /tmp/cur.json
          jq -r '[.data[]["api:political-group"]] | unique | join(", ")' /tmp/cur.json

          echo
          echo "=== one member on their own"
          get "$BASE/meps/$MEP?format=application%2Fld%2Bjson" > /tmp/one.json
          head -c 3000 /tmp/one.json
          echo
          echo "-- its field names"
          jq -r '.data[0] | keys[]' /tmp/one.json 2>/dev/null || jq -r 'keys[]' /tmp/one.json

          echo
          echo "=== the whole term, including members who have since left"
          get "$BASE/meps?parliamentary-term=10&format=application%2Fld%2Bjson&limit=1000&offset=0" > /tmp/all.json
          jq '.data | length' /tmp/all.json
          jq '.data[0]' /tmp/all.json

          echo
          echo "=== the sittings of a year"
          get "$BASE/meetings?year=2026&format=application%2Fld%2Bjson&limit=400" > /tmp/mtg.json
          jq '.data | length' /tmp/mtg.json
          jq -r '[.data[] | keys[]] | unique | join(", ")' /tmp/mtg.json
          jq -r '.data[0] | {id, activity_date, had_activity_type, activity_label: .activity_label.en, hadActivityLocation: (.hadActivityLocation // .had_activity_location)}' /tmp/mtg.json
          jq -r '[.data[].activity_date] | sort | .[0:6] | join(" ")' /tmp/mtg.json
