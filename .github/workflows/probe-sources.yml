# Ask the Parliament's servers what they answer.
#
# This is the job that established where the data can be read from, and it is
# kept so the finding can be re-checked rather than remembered:
#
#   - www.europarl.europa.eu answers 202 with an empty body to every automated
#     request, whatever the address. A bot wall, not a missing page. Nothing in
#     this project reads it.
#   - data.europarl.europa.eu/api/v2 answers properly, and its record of a
#     sitting carries every member's vote.
#
# Run it from the Actions tab when an import starts returning nothing, before
# changing any code: it says in one screen which half of that has changed.
# It writes nothing.

name: Probe the sources

on:
  workflow_dispatch:
    inputs:
      date:
        description: "A sitting date to test, YYYY-MM-DD"
        required: false
        default: "2026-07-09"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask each address what it returns
        run: |
          DATE="${{ inputs.date || '2026-07-09' }}"
          UA='eu-tracker/0.1 (open data import; contact via the repository)'
          BASE=https://data.europarl.europa.eu/api/v2
          LD='format=application%2Fld%2Bjson'

          probe () {
            printf '\n=== %s\n' "$2"
            code=$(curl -sSL -m 45 -o /tmp/body -w '%{http_code} %{content_type} %{size_download}b' \
              -A "$UA" -H 'accept: application/ld+json,application/xml,*/*' "$1" || echo "connection failed")
            printf '    %s\n    -> %s\n' "$1" "$code"
          }

          echo "--- the public website, which is expected to answer 202 and nothing ---"
          probe "https://www.europarl.europa.eu/doceo/document/PV-10-$DATE-RCV_EN.xml" "roll-call annex"

          echo
          echo "--- the open data portal, which is what this project reads ---"
          probe "$BASE/meetings?year=${DATE%%-*}&$LD&limit=5" "the sittings of a year"
          probe "$BASE/meetings/MTG-PL-$DATE/decisions?$LD" "the decisions of a sitting"
          probe "$BASE/meetings/MTG-PL-$DATE/vote-results?$LD" "the vote items behind them"
          probe "$BASE/meps/show-current?$LD&limit=5" "the sitting members"

          echo
          echo "--- and whether a decision still carries its ballots ---"
          curl -sSL -m 60 -A "$UA" "$BASE/meetings/MTG-PL-$DATE/decisions?$LD" > /tmp/dec.json
          jq -r '
            [.data[] | select(has("had_voter_favor"))] as $rc
            | "roll-call decisions: \($rc | length)"
            , (if ($rc | length) > 0 then
                 ($rc[0] | "first: \(.activity_id)  for \(.had_voter_favor | length)"
                          + "  against \(.had_voter_against // [] | length)"
                          + "  abstain \(.had_voter_abstention // [] | length)"
                          + "  first voter \(.had_voter_favor[0])")
               else "NO BALLOTS IN THIS SITTING — the importer would write nothing" end)' /tmp/dec.json
