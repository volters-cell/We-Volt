# Ask the Parliament's servers what they actually answer.
#
# The importer's addresses were written from documentation rather than from a
# live response, and one of them is wrong: the scheduled run reports a 404 for
# the member directory and falls back to the cached copy. This workflow is how
# that gets diagnosed from a machine that can reach europarl.europa.eu.
#
# Run it from the Actions tab; it writes nothing and changes nothing.

name: Probe the sources

on:
  workflow_dispatch:
    inputs:
      date:
        description: "A sitting date to test, YYYY-MM-DD"
        required: false
        default: "2026-07-09"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask each address what it returns
        run: |
          DATE="${{ inputs.date || '2026-07-09' }}"
          probe () {
            printf '\n=== %s\n' "$2"
            code=$(curl -sSL -m 45 -o /tmp/body -w '%{http_code} %{content_type} %{size_download}b' \
              -A 'eu-tracker/0.1 (open data import; contact via the repository)' \
              -H 'accept: application/xml,text/xml,application/json,*/*' "$1" || echo "connection failed")
            printf '    %s -> %s\n' "$1" "$code"
            head -c 220 /tmp/body | tr '\n' ' '
            printf '\n'
          }

          echo "--- the public website ---"
          probe "https://www.europarl.europa.eu/doceo/document/PV-10-$DATE-RCV_EN.xml" "roll-call annex"

          echo
          echo "--- the open data portal ---"
          probe "https://data.europarl.europa.eu/api/v2/openapi.json" "the API's own description"
          probe "https://data.europarl.europa.eu/api/v2/meetings?year=2026&format=application%2Fld%2Bjson&limit=5" "meetings in 2026"
          probe "https://data.europarl.europa.eu/api/v2/meetings/MTG-PL-$DATE/decisions?format=application%2Fld%2Bjson" "decisions taken at a sitting"
          probe "https://data.europarl.europa.eu/api/v2/meetings/MTG-PL-$DATE/vote-results?format=application%2Fld%2Bjson" "vote results for a sitting"
          probe "https://data.europarl.europa.eu/api/v2/meetings/MTG-PL-$DATE/activities?format=application%2Fld%2Bjson" "activities at a sitting"
          probe "https://data.europarl.europa.eu/api/v2/decisions?format=application%2Fld%2Bjson&limit=3" "decisions collection"
          probe "https://data.europarl.europa.eu/api/v2/meps/show-current?format=application%2Fld%2Bjson&limit=2&offset=0" "current members, with country and group"
