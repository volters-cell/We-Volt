# Ask the Parliament's open data portal what its vote records actually contain.
#
# The website answers 202 with an empty body to everything automated, so the
# portal at data.europarl.europa.eu is the only usable source. Its sitting
# endpoints answer properly; what is still unknown is whether a decision
# carries the individual ballots, or only the totals. This job prints the
# shape of the records so the importer can be written against fact.
#
# Run it from the Actions tab; it writes nothing and changes nothing.

name: Probe the sources

on:
  workflow_dispatch:
    inputs:
      date:
        description: "A sitting date to test, YYYY-MM-DD"
        required: false
        default: "2026-07-09"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read the shape of a sitting's votes
        run: |
          DATE="${{ inputs.date || '2026-07-09' }}"
          UA='eu-tracker/0.1 (open data import; contact via the repository)'
          get () { curl -sSL -m 60 -A "$UA" -H 'accept: application/ld+json' "$1"; }
          BASE=https://data.europarl.europa.eu/api/v2

          echo "=== every key that appears on a decision"
          get "$BASE/meetings/MTG-PL-$DATE/decisions?format=application%2Fld%2Bjson" > /tmp/dec.json
          jq -r '[.data[] | keys[]] | unique[]' /tmp/dec.json

          echo
          echo "=== how many decisions, and the first one in full"
          jq '.data | length' /tmp/dec.json
          jq '.data[0]' /tmp/dec.json

          echo
          echo "=== one decision fetched on its own"
          ID=$(jq -r '.data[0].activity_id' /tmp/dec.json)
          echo "id: $ID"
          get "$BASE/meetings/MTG-PL-$DATE/decisions/$ID?format=application%2Fld%2Bjson" > /tmp/one.json
          head -c 4000 /tmp/one.json
          echo

          echo
          echo "=== every key that appears on a vote-result"
          get "$BASE/meetings/MTG-PL-$DATE/vote-results?format=application%2Fld%2Bjson" > /tmp/vr.json
          jq -r '[.data[] | keys[]] | unique[]' /tmp/vr.json
          echo "-- the first vote-result in full"
          jq '.data[0]' /tmp/vr.json

          echo
          echo "=== anything anywhere whose key mentions a voter"
          jq -r '[paths(scalars) | join(".")] | unique[]' /tmp/dec.json | grep -i -E 'voter|ballot|favor|against|abstain|number' | head -40 || echo "none"
