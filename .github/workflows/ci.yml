name: Check the data

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Import logic
        run: node tests/ingest.test.mjs
      - name: Records and reference data
        run: node scripts/validate-data.mjs
