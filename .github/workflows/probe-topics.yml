# Can a vote be labelled with its subject, from the Parliament's own data?
#
# HowTheyVote puts a chip on every entry. The Parliament publishes the subjects
# as EuroVoc concept URIs but has not yet given up a name for one, so this
# reads the API's own index rather than guessing at more endpoint names.
#
# Writes nothing.

name: Probe topics

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/probe-topics.mjs

