# Import an earlier Parliament, a year at a time.
#
# The ninth term is 7,676 final roll-call votes across 223 sitting days —
# counted by scripts/survey-term.mjs against the portal, not estimated. One run
# for all of it would be one enormous commit and nothing to resume from, so the
# window is an input and this is dispatched per year.
#
# It is idempotent. fetch-plenary skips any vote whose sourceId is already
# held, so a re-run after a failure picks up where it stopped.
#
# --term 9 is what the member directory is fetched for: 875 members, 548 of
# whom no longer sit, each needing their country and the group they ended in.
# The directory is merged, never replaced, so tenth-term members who have since
# left keep their names.

name: Backfill a term

# No concurrency group. It was tried and it was wrong: GitHub keeps at most one
# run pending per group, so dispatching four windows cancelled the two in the
# middle. The windows are looped inside a single job instead, which is what
# "one at a time" actually needs.

on:
  workflow_dispatch:
    inputs:
      windows:
        # Space-separated from:until pairs, imported in the order given.
        #
        # The record starts on 1 February 2020 because the votes before it
        # were taken in a 751-seat House with the United Kingdom in it, and
        # this site holds the Union as it is.
        #
        # Not because 2019 is unreadable. This file used to say the portal
        # publishes no decisions before 2020; that was wrong. It publishes 518
        # roll-call decisions across 21 sitting days from the term's opening on
        # 2 July 2019, and they were invisible only because the meeting list
        # spells a 2019 meeting's date under its JSON-LD name and this project
        # read the plain one. Adding "2019-07-02:2020-01-31" here would import
        # them, in the House of the time.
        description: "Windows to import, as from:until pairs"
        required: true
        default: "2023-01-01:2023-12-31 2022-01-01:2022-12-31 2021-01-01:2021-12-31 2020-02-01:2020-12-31"
      term:
        description: "Which Parliament these votes belong to"
        default: "9"
      refresh_meps:
        description: "Re-read the member directory (needed once per term)"
        type: boolean
        default: true
      forget_first:
        # The importer never revisits a vote it already holds, which is right
        # for filling a gap and wrong for correcting one. Turn this on to
        # delete the records in the windows first so they are read again —
        # needed after a fix to how a record is built, not for a plain
        # backfill. Records carrying editorial writing are never deleted.
        description: "Delete the records in these windows first, then read them again"
        type: boolean
        default: false

jobs:
  backfill:
    outputs:
      changed: ${{ steps.windows.outputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # One window at a time, each checked and committed before the next
      # begins, so a failure half way through leaves the windows before it
      # safely in and the rest simply not yet done.
      #
      # A window that fails is put back, not carried forward. With
      # forget_first the records are deleted before they are read again, so a
      # window that dies between the two leaves deletions in the working tree —
      # and the next window's "git add data/" would commit them as though the
      # votes had been removed on purpose. The portal answering 504 must not be
      # able to quietly empty a month of the record. So the tree is restored
      # before the next window starts, and the run ends by naming every window
      # that did not land.
      - name: Import the windows
        id: windows
        run: |
          set -uo pipefail
          git config user.name "eu-tracker-bot"
          git config user.email "actions@github.com"
          first=1
          failed=""
          for window in ${{ inputs.windows }}; do
            from="${window%%:*}"
            until="${window##*:}"
            echo "::group::$from to $until"

            refresh=""
            if [ "$first" = "1" ] && [ "${{ inputs.refresh_meps }}" = "true" ]; then
              refresh="--refresh-meps"
            fi
            first=0

            if ! (
              set -e
              if [ "${{ inputs.forget_first }}" = "true" ]; then
                node scripts/forget-votes.mjs --from "$from" --until "$until"
              fi

              node scripts/fetch-plenary.mjs $refresh \
                --term "${{ inputs.term }}" \
                --from "$from" --since "$from" --until "$until"

              node scripts/tag-topics.mjs
              node scripts/build-index.mjs
              node scripts/build-members.mjs
              node tests/import.test.mjs
              node scripts/validate-data.mjs
            ); then
              echo "::warning::$from to $until did not land. Putting the records back."
              git checkout -- data/
              git clean -fd data/
              failed="$failed $from:$until"
              echo "::endgroup::"
              continue
            fi

            if [ -z "$(git status --porcelain data/)" ]; then
              echo "Nothing new in that window."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              git add data/
              git commit -m "Import $from to $until from the European Parliament

          Backfill of term ${{ inputs.term }}, automated by
          .github/workflows/backfill-term.yml. Records land with an empty
          summary: writing one is editorial work."
              # Somebody else may have pushed while this window was reading the
              # portal — a sibling workflow, or a person. Rebase onto them, and
              # where the conflict is in data/ take the files this run just
              # generated: they were built from the portal minutes ago, and the
              # alternative is throwing away a window's work over a regenerated
              # index. A run lost twenty-five minutes of 2022 to exactly this,
              # because data/meps/index.json had been committed by hand
              # meanwhile.
              if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
                if git diff --name-only --diff-filter=U | grep -qv '^data/'; then
                  echo "::error::Conflict outside data/ — stopping rather than guessing."
                  git rebase --abort || true
                  exit 1
                fi
                git checkout --theirs -- data/ 2>/dev/null || true
                git add data/
                GIT_EDITOR=true git rebase --continue
              fi
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::error::These windows did not land and are unchanged on file:$failed"
            exit 1
          fi

  # A push made with the built-in token does not trigger other workflows. Every
  # window of this backfill committed and none of them reached the site, which
  # is why a rebuilt term could sit in the repository looking finished and
  # change nothing a reader sees.
  publish:
    needs: backfill
    if: always() && needs.backfill.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
